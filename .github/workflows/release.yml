name: Release

# 版本标签 v* → 测包、发 PyPI、建 GitHub Release，再级联：
#   - Sync Main Into Develop
#   - Build Octop FPK（复用本 Release 的 wheel；等待 docker-publish 的多架构 GHCR 镜像）
#
# 与 docker-publish.yml / octop-desktop.yml 并行（由 Auto Tag 同时 dispatch，
# 或人工 push v* tag 同时触发）。桌面产物由 Desktop Package 挂到同一 GitHub Release。

on:
  push:
    tags:
      - "v*"
  # Allow Auto Tag On Release Merge to cascade after a GITHUB_TOKEN tag push
  # (token-authored pushes do not retrigger push workflows).
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test

      - name: Build package
        run: make build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ⛔ 已封堵（2026-10-15）：本 job 会把名为 `octop` 的包发布到 PyPI。
  # 原因：pyproject.toml:6 包名仍为 "octop"（与 src/octop/ 的 import 链强耦合，属技术字面量，暂不改名）。
  #       发布将与 PyPI 上的官方 `octop` 包撞名，并违反禁令一「不向 PyPI 发布 octop 包名」。
  # 恢复条件：包名改为自有前缀（如 moshu-*）并同步 import 链、CI 与文档后，才可删除下面的 `if: false`。
  # 依据文档：D:\ruanjian\octop\octop-合规禁令-2026-10-15.md（禁令一）
  publish:
    name: Publish to PyPI
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # 依赖改链：原为 needs: publish。publish 被 if: false 禁用后会 skipped，
  # 若继续 needs: publish 会导致本 job 永远不执行、GitHub Release 创建不出来，
  # 连带打断 sync-develop / trigger-fnos 与 FPK 产物分发。改为直接依赖 build。
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        run: |
          version=${{ steps.version.outputs.version }}
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?$version\]?/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > .release-notes.md || true
          fi
          if [ ! -s .release-notes.md ]; then
            PREV=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
            {
              echo "## What's changed"
              echo ""
              if [ -n "$PREV" ]; then
                git log "${PREV}..${GITHUB_REF_NAME}" --oneline --no-decorate
              else
                git log --oneline --no-decorate | head -20
              fi
              echo ""
              echo "## Install"
              echo ""
              # 本 Release 不会发布到 PyPI（publish job 已 if: false，见 octop-合规禁令-2026-10-15.md 禁令一）。
              # PyPI 上的 octop 是上游官方包，直接写 "pip install octop==$version" 会误导用户装到他人的包。
              echo "> ⚠️ 本项目**未发布到 PyPI**（Release 的 \`publish\` job 已禁用）。"
              echo "> 请勿执行 \`pip install octop==$version\` —— PyPI 上的 \`octop\` 是上游官方包，不是本定制版。"
              echo ""
              echo "请改用以下方式获取："
              echo ""
              echo '```bash'
              echo "docker pull ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${version}"
              echo '```'
              echo ""
              echo "- 或从本 Release 下方的 **Assets** 下载安装包 / 使用源码部署"
            } > .release-notes.md
          fi
          if ! grep -q '^## Downloads' .release-notes.md; then
            python3 scripts/release_download_links.py "$version" >> .release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .release-notes.md
          files: dist/*
          generate_release_notes: true

  # workflow_run / release:published are unreliable when Release itself was
  # started via GITHUB_TOKEN workflow_dispatch (Auto Tag). Explicitly cascade.
  #
  # This job intentionally has no checkout: pass --repo so `gh` does not need a
  # local .git (bare runner → "fatal: not a git repository"). Dispatch failure
  # must fail this workflow so a missed sync is visible.
  sync-develop:
    name: Trigger sync main into develop
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Sync Main Into Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync-main-to-develop.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version="${{ github.ref_name }}"

  # FnOS FPK：复用本 Release 的 wheel + docker-publish 的 GHCR 镜像。
  # 与 sync-develop 并行。Dispatch 失败必须让本 workflow 变红（PyPI 已发布仍如此）。
  trigger-fnos:
    name: Trigger FnOS FPK build
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build Octop FPK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --ref 用版本 tag，保证 FPK 打在与 PyPI / 镜像相同的 commit 上
          gh workflow run fnos-build-fpk.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
